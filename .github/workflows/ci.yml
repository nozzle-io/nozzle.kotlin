name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        java: [17]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Build native JNI library (non-Windows)
        if: runner.os != 'Windows'
        run: make

      - name: Build native JNI library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make

      - name: Compile Kotlin
        run: gradle compileKotlin compileTestKotlin

      - name: Run tests
        run: gradle test
        env:
          JAVA_TOOL_OPTIONS: "-Djava.library.path=${{ github.workspace }}/.build"

      # nozzle-dev#197: `-shared` links with undefined symbols allowed, so a core source
      # missing from the Makefile's hand-written list leaves a green build that fails
      # at runtime. Force the F16C path whatever the image's default is, then prove
      # no core symbol is left unresolved and the F16C object is actually linked.
      - name: Verify core symbols resolve with F16C enabled
        if: runner.os == 'Linux'
        run: |
          make BUILD_DIR=.build-f16c CXX="c++ -mf16c"
          undefined=$(nm -DC --undefined-only .build-f16c/libnozzle_jni.so)
          if grep -F nozzle <<<"$undefined"; then
            echo "unresolved core symbols in .build-f16c/libnozzle_jni.so" >&2
            exit 1
          fi
          nm -C .build-f16c/libnozzle_jni.so | grep -F ' T nozzle::detail::widen_half_to_float_f16c'

      # nozzle-dev#198: add a source through core's list, then take it out again in the
      # same build directory. The output must gain the source, then lose it.
      - name: Verify a source list change rebuilds the library
        if: runner.os == 'Linux'
        run: |
          list=deps/nozzle/sources/common.txt
          sentinel=deps/nozzle/src/common/ci_sentinel.cpp
          cp "$list" "$RUNNER_TEMP/common.txt"
          echo 'extern "C" int nozzle_ci_sentinel() { return 1; }' > "$sentinel"
          echo src/common/ci_sentinel.cpp >> "$list"
          make BUILD_DIR=.build-incr
          symbols=$(nm -C .build-incr/libnozzle.a)
          grep -F nozzle_ci_sentinel <<<"$symbols"
          cp "$RUNNER_TEMP/common.txt" "$list"
          make BUILD_DIR=.build-incr
          symbols=$(nm -C .build-incr/libnozzle.a)
          if grep -F nozzle_ci_sentinel <<<"$symbols"; then
            echo "the sentinel is still in the output after leaving the list" >&2
            exit 1
          fi
          rm "$sentinel"
